default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

repos:
  # Fast, standard git and file-level hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict

  # Fast Python linting and formatting via Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      # Run linter with safe auto-fix enabled
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --ignore=UP038]
        exclude: ^sandbox/
      # Run formatter
      - id: ruff-format
        exclude: ^sandbox/

  # Fast typo detection honoring typos.toml
  - repo: https://github.com/crate-ci/typos
    rev: v1.30.0
    hooks:
      - id: typos

  # Credential leak prevention honoring .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        files: ^packages/.*/src/

  # Local repository hygiene scripts
  - repo: local
    hooks:
      - id: check-root-sanitization
        name: Sanitize Repository Root Directory
        entry: python scripts/check_root_files.py
        language: system
        pass_filenames: false
        always_run: true
