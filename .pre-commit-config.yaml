default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

repos:
  # Fast, standard git and file-level hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict

  # Fast Python linting and formatting via Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # Run linter with safe auto-fix enabled
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^sandbox/
      # Run formatter
      - id: ruff-format
        exclude: ^sandbox/

  # Fast typo detection honoring typos.toml
  - repo: https://github.com/crate-ci/typos
    rev: v1.30.0
    hooks:
      - id: typos
        args: [--force-exclude]

  # Credential leak prevention honoring .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Local repository hygiene scripts
  - repo: local
    hooks:
      - id: check-root-sanitization
        name: Sanitize Repository Root Directory
        entry: python scripts/check_root_files.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-package-license-parity
        name: Verify Package LICENSE Parity with Root LICENSE
        entry: >-
          python -c "from pathlib import Path; import sys;
          root = Path('LICENSE');
          expected = root.read_bytes();
          pkgs = sorted(p.parent for p in Path('packages').glob('*/pyproject.toml'));
          bad = [
          f'{p / \"LICENSE\"} (symlink)' if (p / 'LICENSE').is_symlink()
          else f'{p / \"LICENSE\"} (missing)' if not (p / 'LICENSE').is_file()
          else f'{p / \"LICENSE\"} (drift)'
          for p in pkgs
          if (p / 'LICENSE').is_symlink() or not (p / 'LICENSE').is_file() or (p / 'LICENSE').read_bytes() != expected
          ];
          assert len(pkgs) == 5, f'Expected 5 workspace packages, found {len(pkgs)}';
          sys.stderr.write('\n'.join(f'LICENSE parity error: {b}' for b in bad) + ('\n' if bad else ''));
          sys.exit(1 if bad else 0)"
        language: system
        pass_filenames: false
        always_run: true
