[project]
name = "apache-airflow-providers-imednet"
version = "1.1.0"
description = "Apache Airflow provider for iMednet"
authors = [
    { name = "Frederick de Ruiter", email = "127706008+fderuiter@users.noreply.github.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Typing :: Typed",
]
dependencies = [
    "imednet>=1.0.0,<2.0.0",
    "imednet-workflows>=1.0.0,<2.0.0",
    "apache-airflow>=3.2.0,<4.0.0"
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1.0,<2.0.0"]
export = [
    "pandas>=2.2.3,<3.0.0",
    "sqlalchemy>=2.0,<3.0",
    "pyarrow>=14.0.1",
    "openpyxl>=3.1,<4.0",
    "duckdb>=1.1.0,<2.0.0",
    "imednet-workflows"
]
mongodb = ["imednet-plugins-sinks", "pymongo>=4.0,<5.0"]
neo4j = ["imednet-plugins-sinks", "neo4j>=6.2.0,<7.0.0"]
snowflake = ["imednet-plugins-sinks", "snowflake-connector-python>=3.0.0", "pyarrow>=14.0.1"]

[project.entry-points."apache_airflow_provider"]
provider_info = "apache_airflow_providers_imednet:get_provider_info"

[project.urls]
repository = "https://github.com/fderuiter/imednet-toolkit"
documentation = "https://fderuiter.github.io/imednet-toolkit/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apache_airflow_providers_imednet"]
artifacts = ["src/apache_airflow_providers_imednet/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/apache_airflow_providers_imednet",
    "/src/apache_airflow_providers_imednet/py.typed",
]
