[project]
name = "apache-airflow-providers-imednet"
version = "1.0.0"
description = "Apache Airflow provider for iMednet"
authors = [
    { name = "Frederick de Ruiter", email = "127706008+fderuiter@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "imednet>=1.0.0,<2.0.0",
    "apache-airflow>=3.2.0,<4.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apache_airflow_providers_imednet"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/apache_airflow_providers_imednet"
]
