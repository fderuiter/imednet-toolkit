[project]
name = "imednet-plugins-sinks"
version = "1.1.0"
description = "Unified database sinks plugin for the iMednet Python SDK."
authors = [
    { name = "Frederick de Ruiter", email = "127706008+fderuiter@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "imednet>=1.0.0,<2.0.0"
]

[project.entry-points."imednet.plugins"]
sinks = "imednet_sinks.plugin:create_sinks"

[project.entry-points."imednet.sinks"]
mongodb = "imednet_sinks.document:MongoDbExportSink"
neo4j = "imednet_sinks.graph:Neo4jExportSink"
snowflake = "imednet_sinks.warehouse:SnowflakeExportSink"

[project.entry-points."imednet.sink_configs"]
mongodb = "imednet_sinks.document:MongoDbSinkConfig"
neo4j = "imednet_sinks.graph:Neo4jSinkConfig"
snowflake = "imednet_sinks.warehouse:SnowflakeSinkConfig"

[project.optional-dependencies]
neo4j = ["neo4j>=6.2.0,<7.0.0"]
mongodb = ["pymongo>=4.0,<5.0"]
snowflake = ["snowflake-connector-python>=3.0.0", "pyarrow>=14.0.1"]
all = ["neo4j>=6.2.0,<7.0.0", "pymongo>=4.0,<5.0", "snowflake-connector-python>=3.0.0", "pyarrow>=14.0.1"]

[project.urls]
repository = "https://github.com/fderuiter/imednet-toolkit"
documentation = "https://fderuiter.github.io/imednet-toolkit/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imednet_sinks"]
artifacts = ["src/imednet_sinks/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/imednet_sinks",
    "/src/imednet_sinks/py.typed",
]
