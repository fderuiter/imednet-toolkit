[project]
name = "imednet-plugins-sinks"
version = "1.0.0"
description = "Unified database sinks plugin for the iMednet Python SDK."
authors = [
    { name = "Frederick de Ruiter", email = "127706008+fderuiter@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "imednet>=1.0.0,<2.0.0"
]

[project.entry-points."imednet.plugins"]
sinks = "imednet_sinks.plugin:create_sinks"

[project.optional-dependencies]
neo4j = ["neo4j>=6.2.0,<7.0.0"]
mongodb = ["pymongo>=4.0,<5.0"]
snowflake = ["pyarrow>=14.0.1"]
all = ["neo4j>=6.2.0,<7.0.0", "pymongo>=4.0,<5.0", "pyarrow>=14.0.1"]

[project.urls]
repository = "https://github.com/fderuiter/imednet-toolkit"
documentation = "https://fderuiter.github.io/imednet-toolkit/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imednet_sinks"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/imednet_sinks"
]
