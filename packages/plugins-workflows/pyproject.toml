[project]
name = "imednet-workflows"
version = "1.1.0"
description = "Workflow plugin package for the iMednet Python SDK"
authors = [
    { name = "Frederick de Ruiter", email = "127706008+fderuiter@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "imednet>=1.0.0,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "filelock>=4.2.1,<5.0.0",
    "cryptography"
]

[project.entry-points."imednet.plugins"]
workflows = "imednet_workflows.namespace:create_workflows"

[project.entry-points."imednet.cli_plugins"]
workflows = "imednet_workflows.cli:setup_parser"
subject_data = "imednet_workflows.cli:setup_subject_parser"

[project.entry-points."imednet.state_providers"]
default = "imednet_workflows.state_ledger:get_state_provider"
file = "imednet_workflows.state_ledger:FileStateProvider"
airflow = "imednet_workflows.state_ledger:AirflowStateProvider"

[project.urls]
repository = "https://github.com/fderuiter/imednet-toolkit"
documentation = "https://fderuiter.github.io/imednet-toolkit/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imednet_workflows"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/imednet_workflows"
]
