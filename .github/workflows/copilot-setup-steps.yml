name: "Copilot Setup Steps"

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: read-all

jobs:
  # CRITICAL: This exact job key name is required by GitHub Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.10"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.10"-

      # Caching dependencies speeds up Copilot engine initialization significantly
      - name: Load cached venv
        id: cached-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install Workspace Dependencies
        run: |
          python -m pip install --upgrade pip
          packages=()
          for package in packages/*; do
            if [ -f "$package/pyproject.toml" ]; then
              packages+=("-e" "$package")
            fi
          done
          packages+=("-e" ".[dev,docs]")
          python -m pip install "${packages[@]}"
