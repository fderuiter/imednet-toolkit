name: SDK Performance Suite

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Restore Workspace Dependencies
        id: cache-uv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-packages --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Save Workspace Dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-uv.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}

      - name: Restore Performance Baseline Cache
        id: restore-perf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/performance_cache.json
          key: perf-baseline-${{ runner.os }}-restore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perf-baseline-${{ runner.os }}-

      - name: Run Performance Suite
        env:
          IMEDNET_POSTMAN_PATH: ${{ github.workspace }}/imednet.postman_collection.json
        run: |
          pytest tests/core/test_performance.py -m performance -v

      - name: Aggregate Verification Report
        if: always()
        run: python scripts/aggregate_verification.py --report-dir reports/verification --expect-track performance

      - name: Save Performance Baseline Cache
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          hashFiles('reports/performance_cache.json') != '' &&
          steps.restore-perf-cache.outputs.cache-matched-key != format('perf-baseline-{0}-{1}', runner.os, hashFiles('reports/performance_cache.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/performance_cache.json
          key: perf-baseline-${{ runner.os }}-${{ hashFiles('reports/performance_cache.json') }}

      - name: Save Verification Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: reports/performance_report.json
          if-no-files-found: error
