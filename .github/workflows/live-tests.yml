name: Live Integration Tests

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "Approve running live integration tests"
        type: boolean
        required: true
        default: false

permissions: read-all

jobs:
  live-validation:
    name: Live Integration Tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approved }}
    runs-on: ubuntu-latest
    environment: live-testing
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"

      - name: Cache Workspace Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.10"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.10"-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          packages=()
          for package in packages/*; do
            if [ -f "$package/pyproject.toml" ]; then
              packages+=("-e" "$package")
            fi
          done
          packages+=("-e" ".[dev,docs]")
          python -m pip install "${packages[@]}"

      - name: Run Smoke Tests
        env:
          IMEDNET_API_KEY: ${{ secrets.IMEDNET_API_KEY }}
          IMEDNET_SECURITY_KEY: ${{ secrets.IMEDNET_SECURITY_KEY }}
          IMEDNET_BASE_URL: ${{ vars.IMEDNET_BASE_URL }}
          IMEDNET_POSTMAN_PATH: ${{ github.workspace }}/imednet.postman_collection.json
        run: |
          python scripts/post_smoke_record.py

      - name: Execute Live Test Suite & Detect Drift
        id: live_tests
        continue-on-error: true
        env:
          IMEDNET_API_KEY: ${{ secrets.IMEDNET_API_KEY }}
          IMEDNET_SECURITY_KEY: ${{ secrets.IMEDNET_SECURITY_KEY }}
          IMEDNET_BASE_URL: ${{ vars.IMEDNET_BASE_URL }}
          IMEDNET_RUN_E2E: "1"
          IMEDNET_ALLOW_MUTATION: ${{ vars.IMEDNET_ALLOW_MUTATION }}
          IMEDNET_STRICT_MODE: "1"
          IMEDNET_POSTMAN_PATH: ${{ github.workspace }}/imednet.postman_collection.json
        run: |
          set +e
          pytest tests/live/ -v --log-cli-level=WARNING > pytest_output.txt 2>&1
          EXIT_CODE=$?
          set -e

          echo "pytest_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          python scripts/aggregate_verification.py

      - name: Post Drift Report
        if: steps.live_tests.outputs.drift_detected == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift_report.txt', 'utf8');
            const body = `### ⚠️ API Drift Detected\n\nThe live integration tests detected schema drift or structural poly-type shifts:\n\n\`\`\`\n${report.substring(0, 60000)}\n\`\`\``;
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Failed to post drift report comment:', error.message);
            }

      - name: Fail if tests failed
        if: steps.live_tests.outputs.pytest_exit_code != '0'
        run: |
          cat pytest_output.txt
          exit ${{ steps.live_tests.outputs.pytest_exit_code }}
