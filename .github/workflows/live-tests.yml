name: Live Integration Tests

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "Approve running live integration tests"
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-validation:
    name: Live Integration Tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approved }}
    runs-on: ubuntu-latest
    environment: live-testing
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Restore Workspace Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-py3.11-

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: "false"

      - name: Install Dependencies
        run: |
          uv sync --locked --all-packages --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Execute Live Test Suite & Detect Drift
        id: live_tests
        continue-on-error: true
        env:
          IMEDNET_API_KEY: ${{ secrets.IMEDNET_API_KEY }}
          IMEDNET_SECURITY_KEY: ${{ secrets.IMEDNET_SECURITY_KEY }}
          IMEDNET_BASE_URL: ${{ vars.IMEDNET_BASE_URL }}
          IMEDNET_RUN_E2E: "1"
          IMEDNET_ALLOW_MUTATION: ${{ vars.IMEDNET_ALLOW_MUTATION }}
          IMEDNET_STRICT_MODE: "1"
          IMEDNET_POSTMAN_PATH: ${{ github.workspace }}/imednet.postman_collection.json
        run: |
          set +e
          pytest tests/live/ -v --log-cli-level=WARNING > pytest_output.txt 2>&1
          EXIT_CODE=$?
          set -e

          echo "pytest_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          python scripts/aggregate_verification.py --report-dir reports/verification --expect-track drift

      - name: Summarize Live Validation
        if: always()
        env:
          PYTEST_EXIT_CODE: ${{ steps.live_tests.outputs.pytest_exit_code }}
          DRIFT_DETECTED: ${{ steps.live_tests.outputs.drift_detected }}
          DRIFT_COUNT: ${{ steps.live_tests.outputs.drift_count }}
        run: |
          {
            echo "### Live validation"
            printf 'Pytest exit code: %s\n' "${PYTEST_EXIT_CODE:-not run}"
            printf 'Drift detected: %s\n' "${DRIFT_DETECTED:-unknown}"
            printf 'Drift violations: %s\n' "${DRIFT_COUNT:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Verification Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-report
          path: reports/verification/drift_report.json
          if-no-files-found: error

      - name: Fail if validation failed
        if: always()
        env:
          PYTEST_EXIT_CODE: ${{ steps.live_tests.outputs.pytest_exit_code }}
          VALIDATION_OUTCOME: ${{ steps.live_tests.outcome }}
          DRIFT_DETECTED: ${{ steps.live_tests.outputs.drift_detected }}
        run: |
          if [[ "$VALIDATION_OUTCOME" != "success" || "$PYTEST_EXIT_CODE" != "0" || "$DRIFT_DETECTED" == "true" ]]; then
            if [[ -f pytest_output.txt ]]; then
              cat pytest_output.txt
            fi
            if [[ -f reports/verification/drift_report.txt ]]; then
              cat reports/verification/drift_report.txt
            elif [[ -f drift_report.txt ]]; then
              cat drift_report.txt
            fi
            exit 1
          fi
