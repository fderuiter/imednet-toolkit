name: Live Integration Tests

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "Approve running live integration tests"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  live-validation:
    name: Live Integration Tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approved }}
    runs-on: ubuntu-latest
    environment: live-testing
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          packages=()
          for package in packages/*; do
            if [ -f "$package/pyproject.toml" ]; then
              packages+=("-e" "$package")
            fi
          done
          packages+=("-e" ".[dev,docs]")
          python -m pip install "${packages[@]}"

      - name: Execute Live Test Suite & Detect Drift
        id: live_tests
        continue-on-error: true
        env:
          IMEDNET_API_KEY: ${{ secrets.IMEDNET_API_KEY }}
          IMEDNET_SECURITY_KEY: ${{ secrets.IMEDNET_SECURITY_KEY }}
          IMEDNET_BASE_URL: ${{ vars.IMEDNET_BASE_URL }}
          IMEDNET_RUN_E2E: "1"
          IMEDNET_ALLOW_MUTATION: ${{ vars.IMEDNET_ALLOW_MUTATION }}
          IMEDNET_STRICT_MODE: "1"
          IMEDNET_POSTMAN_PATH: ${{ github.workspace }}/imednet.postman_collection.json
        run: |
          set +e
          pytest tests/live/ -v --log-cli-level=WARNING > pytest_output.txt 2>&1
          EXIT_CODE=$?
          set -e

          echo "pytest_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          python scripts/aggregate_verification.py

      - name: Summarize Live Validation
        if: always()
        env:
          PYTEST_EXIT_CODE: ${{ steps.live_tests.outputs.pytest_exit_code }}
          DRIFT_DETECTED: ${{ steps.live_tests.outputs.drift_detected }}
          DRIFT_COUNT: ${{ steps.live_tests.outputs.drift_count }}
        run: |
          {
            echo "### Live validation"
            printf 'Pytest exit code: %s\n' "${PYTEST_EXIT_CODE:-not run}"
            printf 'Drift detected: %s\n' "${DRIFT_DETECTED:-unknown}"
            printf 'Drift violations: %s\n' "${DRIFT_COUNT:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if validation failed
        if: always()
        env:
          PYTEST_EXIT_CODE: ${{ steps.live_tests.outputs.pytest_exit_code }}
          VALIDATION_OUTCOME: ${{ steps.live_tests.outcome }}
        run: |
          if [[ "$VALIDATION_OUTCOME" != "success" || "$PYTEST_EXIT_CODE" != "0" ]]; then
            if [[ -f pytest_output.txt ]]; then
              cat pytest_output.txt
            fi
            exit 1
          fi
