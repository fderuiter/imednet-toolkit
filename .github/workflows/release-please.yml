name: Automated Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '**/*.md'

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Use GITHUB_TOKEN for release-please operations.
          # PyPI deployment is handled in main.yml on release commits to main,
          # so publishing does not depend on tag-triggered workflow runs.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        continue-on-error: true
        id: checkout-release-pr
        uses: actions/checkout@v4
        with:
          ref: release-please--branches--main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update uv lockfile
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.checkout-release-pr.outcome == 'success' }}
        run: |
          pip install uv
          uv lock
          if ! git diff --quiet uv.lock; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add uv.lock
            git commit -m "chore: update uv.lock for release"
            git push origin release-please--branches--main
          fi
