name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ------------------------------------------------------------------
  # JOB 0: PR TITLE LINT (Pull requests only)
  # ------------------------------------------------------------------
  semantic-pr-title:
    name: Semantic PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        if: ${{ !contains(github.event.pull_request.user.login, '[bot]') }}
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            test
            refactor
            perf
            revert

  # ------------------------------------------------------------------
  # JOB 1: QUALITY GATE (Runs per package)
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # JOB 0.1: GLOBAL LINTING (Runs unconditionally)
  # ------------------------------------------------------------------
  global-lint:
    name: Global Code Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install 'ruff==0.15.22'
      - name: Run Ruff Linter
        run: ruff check . --select F401,F841

  # ------------------------------------------------------------------
  # JOB 0.2: PRE-COMMIT CHECK (Runs unconditionally)
  # ------------------------------------------------------------------
  pre-commit:
    name: Pre-commit Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # ------------------------------------------------------------------
  # JOB 0.5: DETECT CHANGES & PLAN
  # ------------------------------------------------------------------
  plan:
    name: Plan CI Execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      run_integration: ${{ steps.filter.outputs.export_logic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            export_logic:
              - 'packages/**/integrations/**'
              - 'packages/**/tests/integration/**'
              - 'docker-compose.yml'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          separator: ","

      - name: Determine Impacted Packages
        id: set-matrix
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          if [ -z "$ALL_CHANGED_FILES" ]; then
            PLAN=$(echo "" | python3 scripts/ci_plan.py)
          else
            PLAN=$(echo "$ALL_CHANGED_FILES" | tr ',' '\n' | python3 scripts/ci_plan.py)
          fi
          echo "Impacted packages: $PLAN"
          echo "matrix=$(echo "$PLAN" | jq -c '.test')" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$(echo "$PLAN" | jq -c '.build')" >> "$GITHUB_OUTPUT"

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

  quality:
    name: Workspace Quality & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-
      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch uv

      - name: Audit locked workspace dependencies
        run: |
          uv export --locked --all-packages --all-extras --no-emit-workspace \
            --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/imednet-locked.txt"
          uvx pip-audit -s osv --timeout 60 --disable-pip --no-deps \
            -r "$RUNNER_TEMP/imednet-locked.txt"

      - name: Run Quality & Security Checks
        run: hatch run quality:all packages

      - name: Run Canonical Workspace Verification
        run: hatch run verify

      - name: Verify Model Type Stubs
        run: |
          hatch run python -m imednet.models.engine --check
          hatch run python -c "from imednet.models.engine import ModelEngine; ModelEngine.generate_stubs('packages/core/src/imednet/models')"
          git diff --exit-code packages/core/src/imednet/models/

  # ------------------------------------------------------------------
  # JOB 2: BUILD ARTIFACT (Builds the library)
  # ------------------------------------------------------------------
  build:
    name: Build Distribution
    needs: [plan, quality]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-
      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Tighten Internal Dependencies
        run: python scripts/tighten_dependencies.py --rewrite

      - name: Build Workspace Packages
        env:
          BUILD_MATRIX: ${{ needs.plan.outputs.build_matrix }}
        run: |
          IMPACTED=$(echo "$BUILD_MATRIX" | jq -r '.[]')
          for package in packages/*; do
            if [ -f "$package/pyproject.toml" ]; then
              PKG_NAME=$(basename "$package")
              if echo "$IMPACTED" | grep -qx "$PKG_NAME"; then
                (
                  cd "$package"
                  hatch build
                )
              else
                echo "Skipping $PKG_NAME as it is not impacted by this change plan."
              fi
            fi
          done

      - name: Upload Core Artifact
        if: contains(fromJSON(needs.plan.outputs.build_matrix), 'core')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-core
          path: packages/core/dist/
          retention-days: 1

      - name: Upload Workflows Artifact
        if: contains(fromJSON(needs.plan.outputs.build_matrix), 'plugins-workflows')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-workflows
          path: packages/plugins-workflows/dist/
          retention-days: 1

      - name: Upload Providers Artifact
        if: contains(fromJSON(needs.plan.outputs.build_matrix), 'providers-airflow')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-providers
          path: packages/providers-airflow/dist/
          retention-days: 1

      - name: Upload Sinks Artifact
        if: contains(fromJSON(needs.plan.outputs.build_matrix), 'plugins-sinks')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sinks
          path: packages/plugins-sinks/dist/
          retention-days: 1

      - name: Upload TUI Artifact
        if: contains(fromJSON(needs.plan.outputs.build_matrix), 'plugins-tui')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-tui
          path: packages/plugins-tui/dist/
          retention-days: 1

      - name: Restore Internal Dependencies
        if: always()
        run: python scripts/tighten_dependencies.py --restore

  # ------------------------------------------------------------------
  # JOB 3: TEST MATRIX (Tests impacted packages)
  # ------------------------------------------------------------------
  test:
    name: Test ${{ matrix.package }} (Python ${{ matrix.python-version }})
    needs: [plan, build]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.matrix) }}
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Download Built Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

          if ls dist/*.whl 1> /dev/null 2>&1; then
            uv pip install --force-reinstall --no-deps dist/*.whl
          fi

      - name: Run Tests
        env:
          PACKAGE: ${{ matrix.package }}
          IMEDNET_API_KEY: dummy
          IMEDNET_SECURITY_KEY: dummy
          IMEDNET_POSTMAN_PATH: ${{ github.workspace }}/imednet.postman_collection.json
        run: |
          if [ "$PACKAGE" = "core" ]; then
            TEST_ARGS="--ignore-glob=*airflow* --ignore-glob=*workflows* --ignore-glob=*sinks* --ignore-glob=*tui/* tests/"
            COV_ARGS="--cov=imednet"
          elif [ "$PACKAGE" = "plugins-workflows" ]; then


            TEST_ARGS="tests/unit/test_workflows*.py tests/unit/workflows/ tests/workflows/ tests/unit/test_chunked_pipeline.py tests/unit/cli/ tests/unit/test_config_version_control.py tests/unit/test_duckdb_ingestion_workflow.py tests/unit/test_job_poller.py tests/unit/test_record_mapper.py tests/unit/test_record_mapper_hierarchy.py tests/unit/test_state_ledger.py tests/unit/test_study_structure.py tests/unit/test_sync_worker.py tests/unit/test_cached_records_loader.py"
            COV_ARGS="--cov=imednet_workflows"
          elif [ "$PACKAGE" = "providers-airflow" ]; then
            TEST_ARGS="tests/unit/test_airflow*.py"
            COV_ARGS="--cov=apache_airflow_providers_imednet"
          elif [ "$PACKAGE" = "plugins-sinks" ]; then
            TEST_ARGS="packages/plugins-sinks/tests/"
            COV_ARGS="--cov=imednet_sinks"
          elif [ "$PACKAGE" = "plugins-tui" ]; then
            TEST_ARGS="packages/plugins-tui/tests/ tests/unit/tui/ tests/unit/cli/test_tui_cli.py"
            COV_ARGS="--cov=imednet_tui"
          fi

          hatch run test -q $COV_ARGS --cov-report=xml --cov-fail-under=90 -m "not live" --ignore=tests/live/ $TEST_ARGS || {
            RET=$?
            if [ $RET -eq 5 ]; then
              echo "No tests collected for $PACKAGE. Passing gracefully."
              exit 0
            else
              exit $RET
            fi
          }

  # ------------------------------------------------------------------
  # JOB 3.5: INTEGRATION SANDBOX (Hermetic testing for localizable sinks)
  # ------------------------------------------------------------------
  integration-sandbox:
    name: Hermetic Integration Sandbox
    needs: [plan, build]
    if: needs.plan.outputs.run_integration == 'true' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run Hermetic Integration Sandbox
        env:
          IMEDNET_API_KEY: dummy
          IMEDNET_SECURITY_KEY: dummy
        run: |
          echo "Starting ephemeral containerized databases..."
          docker compose up -d
          echo "Waiting for databases to initialize..."
          sleep 15
          echo "Running integration tests..."
          IMEDNET_TEST_CONTAINERS=1 pytest packages/plugins-sinks/tests/integration/test_containerized_sinks.py -v || { status=$?; docker compose down -v; exit $status; }
          echo "Cleaning up containers..."
          docker compose down -v

  # ------------------------------------------------------------------
  # JOB 3.6: SECURITY ROBUSTNESS (Fuzzing)
  # ------------------------------------------------------------------
  fuzzing:
    name: Robustness Fuzzing
    needs: build
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.12"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.12"-
      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run Coverage-Guided Fuzzing (1,000,000 iterations)
        run: pytest tests/core/test_fuzz.py -m fuzzing -v

      - name: Save Verification Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzing-report
          path: fuzzing_report.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # JOB 3.7: VALIDATE EXTRAS
  # ------------------------------------------------------------------
  validate-extras:
    name: Validate Documented Extras
    needs: build
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        extra: ["export", "duckdb", "mongodb", "neo4j", "snowflake", "cli", "tui"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Install hatch
        run: python -m pip install uv hatch

      - name: Tighten Internal Dependencies
        run: python scripts/tighten_dependencies.py --rewrite

      - name: Build Packages
        run: |
          (cd packages/plugins-workflows && hatch build)
          (cd packages/plugins-sinks && hatch build)
          (cd packages/plugins-tui && hatch build)
          (cd packages/core && hatch build)

      - name: Restore Internal Dependencies
        if: always()
        run: python scripts/tighten_dependencies.py --restore

      - name: Install Core with Extra
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          WHEEL=$(ls packages/core/dist/imednet-*.whl)
          SINKS_WHEEL=$(ls packages/plugins-sinks/dist/imednet_plugins_sinks-*.whl)
          WORKFLOWS_WHEEL=$(ls packages/plugins-workflows/dist/imednet_workflows-*.whl)
          TUI_WHEEL=$(ls packages/plugins-tui/dist/imednet_tui-*.whl)
          python3 -m pip install "$WHEEL" "$SINKS_WHEEL" "$WORKFLOWS_WHEEL" "$TUI_WHEEL"
          python3 -m pip install "${WHEEL}[${EXTRA}]"

      - name: Verify CLI Availability
        run: |
          imednet --help

  # ------------------------------------------------------------------
  # JOB 3.8: VALIDATE PACKAGE CONSUMPTION
  # ------------------------------------------------------------------
  validate-package-consumption:
    name: Validate Package Consumption
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Install build tool
        run: python -m pip install build

      - name: Tighten Internal Dependencies
        run: python scripts/tighten_dependencies.py --rewrite

      - name: Validate Package Consumption
        run: python scripts/validate_package_consumption.py

      - name: Restore Internal Dependencies
        if: always()
        run: python scripts/tighten_dependencies.py --restore

  # ------------------------------------------------------------------
  # JOB 4: DOCS (Build & Prepare for Deploy)
  # ------------------------------------------------------------------
  docs:
    name: Build Documentation
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Validate Showcases
        run: hatch run validate-showcases

      - name: Validate Documentation
        run: hatch run validate-docs

      - name: Build HTML and Run Doctests
        run: hatch run docs

      - name: Assert Clean Working Tree
        run: |
          if ! git diff --quiet docs/; then
            echo "Uncommitted changes detected in docs/:"
            git diff --name-only docs/
            echo ""
            echo "Diff:"
            git diff docs/
            exit 1
          fi
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "Untracked generated files detected in docs/:"
            git status --short docs/
            exit 1
          fi
          git diff --exit-code docs/
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after documentation build:"
            git status --short
            exit 1
          fi

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  # ------------------------------------------------------------------
  # JOB 5: DEPLOY DOCS (Only on main push)
  # ------------------------------------------------------------------
  deploy-docs:
    name: Deploy to GH Pages
    needs: [plan, test, docs, global-lint, quality]
    concurrency:
      group: pages
      cancel-in-progress: false
    # Only deploy docs if tests pass (or are skipped) and we are on main
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
