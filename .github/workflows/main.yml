name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ------------------------------------------------------------------
  # JOB 0: PR TITLE LINT (Pull requests only)
  # ------------------------------------------------------------------
  semantic-pr-title:
    name: Semantic PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        if: ${{ !contains(github.event.pull_request.user.login, '[bot]') }}
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            test
            refactor
            perf
            revert

  # ------------------------------------------------------------------
  # JOB 1: QUALITY GATE (Runs per package)
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # JOB 0.1: GLOBAL LINTING (Runs unconditionally)
  # ------------------------------------------------------------------
  global-lint:
    name: Global Code Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: "false"
      - name: Run Global Lint & Spelling Checks
        run: |
          uvx --from "ruff==0.15.22" ruff format --check .
          uvx --from "ruff==0.15.22" ruff check .
          uvx --from "typos==1.30.0" typos --force-exclude .

  # ------------------------------------------------------------------
  # JOB 0.2: PRE-COMMIT CHECK (Runs unconditionally)
  # ------------------------------------------------------------------
  pre-commit:
    name: Pre-commit Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: "false"
      - name: Run pre-commit hooks
        run: uvx --from "pre-commit==4.7.0" pre-commit run --all-files --show-diff-on-failure

  # ------------------------------------------------------------------
  # JOB 0.5: DETECT CHANGES & PLAN
  # ------------------------------------------------------------------
  plan:
    name: Plan CI Execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      run_integration: ${{ steps.set-matrix.outputs.run_integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            export_logic:
              - 'packages/**/integrations/**'
              - 'packages/**/tests/integration/**'
              - 'packages/plugins-sinks/**'
              - 'docker-compose.yml'

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          separator: ","

      - name: Determine Impacted Packages
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          EXPORT_LOGIC: ${{ steps.filter.outputs.export_logic }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            PLAN=$(python3 scripts/ci_plan.py < /dev/null)
            RUN_INTEGRATION="true"
          else
            if [ -z "$ALL_CHANGED_FILES" ]; then
              PLAN=$(echo "" | python3 scripts/ci_plan.py)
            else
              PLAN=$(echo "$ALL_CHANGED_FILES" | tr ',' '\n' | python3 scripts/ci_plan.py)
            fi
            RUN_INTEGRATION="${EXPORT_LOGIC:-false}"
          fi
          echo "Impacted packages: $PLAN (run_integration=$RUN_INTEGRATION)"
          echo "matrix=$(echo "$PLAN" | jq -c '.test')" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$(echo "$PLAN" | jq -c '.build')" >> "$GITHUB_OUTPUT"
          echo "run_integration=$RUN_INTEGRATION" >> "$GITHUB_OUTPUT"

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

  quality:
    name: Workspace Quality & Security
    needs: [pre-commit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: "false"
      - name: Install Dependencies
        run: uv sync --locked --all-packages --all-extras

      - name: Audit locked workspace dependencies
        run: |
          uv export --locked --all-packages --all-extras --no-emit-workspace \
            --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/imednet-locked.txt"
          uvx pip-audit -s osv --timeout 60 --disable-pip --no-deps \
            -r "$RUNNER_TEMP/imednet-locked.txt"

      - name: Run Quality & Security Checks
        run: |
          uvx --from "detect-secrets==1.5.0" python scripts/run_secret_scan.py .
          uvx --from "semgrep==1.185.0" semgrep scan --config p/security-audit --metrics off --error packages
          uvx --from "vulture>=2.11" vulture packages vulture_whitelist.py --min-confidence 80 --exclude "**/tests/**,**/docs/**,**/scripts/**"
          uvx --from "pylint>=3.0.0" pylint --rcfile=pyproject.toml --disable=all --enable=similarities --min-similarity-lines=20 --ignore-paths='.*/tests/.*,.*/docs/.*,.*/scripts/.*,.*/models/.*,tests/.*,docs/.*,scripts/.*,.*\.json$' --ignore-patterns='.*monitor.*,.*integrations.*,.*sinks.*,.*testing.*' packages
          uvx --from "pylint>=3.0.0" pylint --rcfile=pyproject.toml --disable=all --enable=duplicate-code packages

      - name: Run Canonical Workspace Verification
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run typos --force-exclude .
          uv run mypy packages examples tests/typing/endpoint_contracts.py
          uv run pytest -q --cov=imednet --cov=imednet_workflows --cov=apache_airflow_providers_imednet --cov=imednet_sinks --cov=imednet_tui --cov-fail-under=90

      - name: Verify Model Type Stubs
        run: |
          uv run python -m imednet.models.engine --check
          uv run python -c "from imednet.models.engine import ModelEngine; ModelEngine.generate_stubs('packages/core/src/imednet/models')"
          git diff --exit-code packages/core/src/imednet/models/

  # ------------------------------------------------------------------
  # JOB 2: BUILD ARTIFACT (Builds the library)
  # ------------------------------------------------------------------
  build:
    name: Build Distribution
    needs: [plan, quality]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-
      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-packages --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Tighten Internal Dependencies
        run: python scripts/tighten_dependencies.py --rewrite

      - name: Build Workspace Packages
        env:
          BUILD_MATRIX: ${{ needs.plan.outputs.build_matrix }}
        run: |
          if echo "$BUILD_MATRIX" | jq -e 'length > 0' > /dev/null; then
            for package in packages/*; do
              if [ -f "$package/pyproject.toml" ]; then
                (
                  cd "$package"
                  hatch build
                )
              fi
            done
          else
            echo "No package sources changed; skipping wheel builds."
          fi

      - name: Upload Core Artifact
        if: needs.plan.outputs.build_matrix != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-core
          path: packages/core/dist/
          retention-days: 1

      - name: Upload Workflows Artifact
        if: needs.plan.outputs.build_matrix != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-workflows
          path: packages/plugins-workflows/dist/
          retention-days: 1

      - name: Upload Providers Artifact
        if: needs.plan.outputs.build_matrix != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-providers
          path: packages/providers-airflow/dist/
          retention-days: 1

      - name: Upload Sinks Artifact
        if: needs.plan.outputs.build_matrix != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sinks
          path: packages/plugins-sinks/dist/
          retention-days: 1

      - name: Upload TUI Artifact
        if: needs.plan.outputs.build_matrix != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-tui
          path: packages/plugins-tui/dist/
          retention-days: 1

      - name: Restore Internal Dependencies
        if: always()
        run: python scripts/tighten_dependencies.py --restore

  # ------------------------------------------------------------------
  # JOB 3: TEST MATRIX (Tests impacted packages)
  # ------------------------------------------------------------------
  test:
    name: Test ${{ matrix.package }} (Python ${{ matrix.python-version }})
    needs: [plan, build]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.matrix) }}
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Download Built Artifacts
        if: needs.plan.outputs.build_matrix != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-packages --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

          if ls dist/*.whl 1> /dev/null 2>&1; then
            uv pip install --force-reinstall --no-deps dist/*.whl
          fi

      - name: Run Tests
        env:
          PACKAGE: ${{ matrix.package }}
          IMEDNET_API_KEY: dummy
          IMEDNET_SECURITY_KEY: dummy
          IMEDNET_POSTMAN_PATH: ${{ github.workspace }}/imednet.postman_collection.json
        run: |
          if [ "$PACKAGE" = "core" ]; then
            TEST_ARGS="--ignore-glob=*airflow* --ignore-glob=*workflows* --ignore-glob=*sinks* --ignore-glob=*tui/* tests/"
            COV_ARGS="--cov=imednet"
          elif [ "$PACKAGE" = "plugins-workflows" ]; then
            TEST_ARGS="tests/unit/test_workflows*.py tests/integration/test_workflows*.py tests/integration/test_sync_worker_integration.py tests/unit/workflows/ tests/workflows/ tests/unit/test_chunked_pipeline.py tests/unit/cli/ tests/unit/test_config_version_control.py tests/unit/test_duckdb_ingestion_workflow.py tests/unit/test_job_poller.py tests/unit/test_record_mapper.py tests/unit/test_record_mapper_hierarchy.py tests/unit/test_state_ledger.py tests/unit/test_state_ledger_providers.py tests/unit/test_study_structure.py tests/unit/test_sync_worker.py tests/unit/test_cached_records_loader.py tests/unit/test_batch_validation_and_polling.py tests/unit/test_keyed_upserts_and_watermark_recovery.py tests/unit/test_mode_safe_plugin_protocols.py tests/unit/test_tabular_import.py"
            COV_ARGS="--cov=imednet_workflows"
          elif [ "$PACKAGE" = "providers-airflow" ]; then
            TEST_ARGS="tests/unit/test_airflow*.py tests/integration/test_airflow*.py"
            COV_ARGS="--cov=apache_airflow_providers_imednet"
          elif [ "$PACKAGE" = "plugins-sinks" ]; then
            TEST_ARGS="packages/plugins-sinks/tests/"
            COV_ARGS="--cov=imednet_sinks"
          elif [ "$PACKAGE" = "plugins-tui" ]; then
            TEST_ARGS="packages/plugins-tui/tests/ tests/unit/tui/ tests/unit/cli/test_tui_cli.py"
            COV_ARGS="--cov=imednet_tui"
          fi

          if ls dist/*.whl 1> /dev/null 2>&1; then
            export IMEDNET_TEST_WHEELS=1
          fi

          .venv/bin/pytest -q $COV_ARGS --cov-report=xml --cov-fail-under=90 -m "not live" --ignore=tests/live/ $TEST_ARGS

  # ------------------------------------------------------------------
  # JOB 3.5: INTEGRATION SANDBOX (Hermetic testing for localizable sinks)
  # ------------------------------------------------------------------
  integration-sandbox:
    name: Hermetic Integration Sandbox
    needs: [plan, build]
    if: needs.plan.outputs.run_integration == 'true' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Install Dependencies
        run: |
          python -m pip install uv hatch
          uv sync --locked --all-packages --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run Hermetic Integration Sandbox
        env:
          IMEDNET_API_KEY: dummy
          IMEDNET_SECURITY_KEY: dummy
        run: |
          echo "Starting ephemeral containerized databases..."
          docker compose up -d
          echo "Waiting for databases to initialize..."
          sleep 15
          echo "Running integration tests..."
          IMEDNET_TEST_CONTAINERS=1 pytest packages/plugins-sinks/tests/integration/test_containerized_sinks.py -v || { status=$?; docker compose down -v; exit $status; }
          echo "Cleaning up containers..."
          docker compose down -v

  # ------------------------------------------------------------------
  # JOB 3.6: SECURITY ROBUSTNESS (Fuzzing)
  # ------------------------------------------------------------------
  fuzzing:
    name: Robustness Fuzzing
    needs: [plan, build]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore Workspace Dependencies
        id: cache-uv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.12"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.12"-

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: "false"

      - name: Install Dependencies
        run: |
          uv sync --locked --all-packages --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Save Workspace Dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-uv.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.12"-${{ hashFiles('uv.lock') }}

      - name: Restore Fuzzing Corpus Cache
        id: restore-fuzz-corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/verification/fuzz_corpus/
          key: fuzz-corpus-${{ runner.os }}-sha256-restore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-sha256-
            fuzz-corpus-${{ runner.os }}-

      - name: Run Coverage-Guided Fuzzing (25,000 iterations)
        env:
          IMEDNET_FUZZ_RUNS: "25000"
        run: pytest tests/core/test_fuzz.py -m fuzzing -v

      - name: Aggregate Verification Report
        if: always()
        run: python scripts/aggregate_verification.py --report-dir reports/verification --expect-track fuzzing

      - name: Save Verification Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzing-report
          path: reports/verification/fuzzing_report.json
          if-no-files-found: error

      - name: Save Fuzzing Corpus Cache
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          hashFiles('.cache/verification/fuzz_corpus/**') != '' &&
          steps.restore-fuzz-corpus.outputs.cache-matched-key != format('fuzz-corpus-{0}-sha256-{1}', runner.os, hashFiles('.cache/verification/fuzz_corpus/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/verification/fuzz_corpus/
          key: fuzz-corpus-${{ runner.os }}-sha256-${{ hashFiles('.cache/verification/fuzz_corpus/**') }}

  # ------------------------------------------------------------------
  # JOB 3.8: VALIDATE PACKAGE CONSUMPTION
  # ------------------------------------------------------------------
  validate-package-consumption:
    name: Validate Package Consumption
    needs: [plan, build]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Download Built Artifacts
        if: needs.plan.outputs.build_matrix != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: "false"

      - name: Install Dependencies
        run: |
          uv sync --locked --all-packages --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate Package Consumption
        run: python scripts/validate_package_consumption.py --wheel-dir dist

  # ------------------------------------------------------------------
  # JOB 4: DOCS (Build & Prepare for Deploy)
  # ------------------------------------------------------------------
  docs:
    name: Build Documentation
    needs: [plan, build]
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-"3.11"-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-"3.11"-

      - name: Download Built Artifacts
        if: needs.build.result == 'success' && needs.plan.outputs.build_matrix != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/wheels
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: "false"
      - name: Install Dependencies
        run: |
          uv sync --locked --all-packages --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build and Validate Documentation
        run: uv run python scripts/build_docs.py --wheel-dir "$RUNNER_TEMP/wheels"

      - name: Verify Interactive Pyodide Tutorials
        run: |
          uv run --no-project --with playwright playwright install --with-deps chromium
          uv run --no-project --with playwright python scripts/verify_pyodide_tutorials.py --html-dir docs/_build/html

      - name: Verify Documentation Accessibility and Diagrams in Chromium
        env:
          IMEDNET_REQUIRE_PLAYWRIGHT: "1"
          IMEDNET_BUILT_HTML_DIR: docs/_build/html
        run: |
          uv run --with playwright pytest -o addopts="" tests/unit/test_docs_accessibility.py
          rm -rf reports coverage.xml .coverage* .pytest_cache test-results playwright-report

      - name: Assert Clean Working Tree
        run: |
          if ! git diff --quiet docs/; then
            echo "Uncommitted changes detected in docs/:"
            git diff --name-only docs/
            echo ""
            echo "Diff:"
            git diff docs/
            exit 1
          fi
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "Untracked generated files detected in docs/:"
            git status --short docs/
            exit 1
          fi
          git diff --exit-code docs/
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after documentation build:"
            git status --short
            exit 1
          fi

      - name: Upload Documentation Preview Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html-preview
          path: docs/_build/html
          retention-days: 5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  # ------------------------------------------------------------------
  # JOB 5: DEPLOY DOCS (Only on main push or manual dispatch)
  # ------------------------------------------------------------------
  deploy-docs:
    name: Deploy to GH Pages
    needs:
      - plan
      - global-lint
      - pre-commit
      - quality
      - build
      - test
      - integration-sandbox
      - fuzzing
      - validate-package-consumption
      - docs
    concurrency:
      group: pages
      cancel-in-progress: false
    # Only deploy docs if all ten upstream checks succeed without skip, failure, or cancellation on main
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.global-lint.result == 'success' &&
      needs.pre-commit.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.integration-sandbox.result == 'success' &&
      needs.fuzzing.result == 'success' &&
      needs.validate-package-consumption.result == 'success' &&
      needs.docs.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
