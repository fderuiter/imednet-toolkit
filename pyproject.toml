[project]
name = "imednet-workspace"
version = "0.1.0"
description = "Monorepo workspace for imednet packages"
authors = [
    { name = "Frederick de Ruiter", email = "127706008+fderuiter@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "imednet",
    "imednet-workflows",
    "imednet-streamlit",
    "imednet-plugins-sinks"
]

[project.optional-dependencies]
dev = [
    "pandas>=2.2.3,<3.0.0",
    "duckdb>=1.1.0",
    "pyarrow>=14.0.1",
    "pytest>=9.0.3",
    "pytest-cov>=6.1.1,<8.0.0",
    "respx>=0.22.0,<0.24.0",
    "pytest-asyncio>=0.24.0",
    "faker>=24.9.0,<41.0.0",
    "sphinx>=6.2.0,<9.0.0",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
    "sqlalchemy>=2.0,<3.0.0",
    "openpyxl>=3.1,<4.0.0",
    "sphinxcontrib-mermaid>=0.9.2,<2.2.0",
    "neo4j>=6.2.0,<7.0.0",
    "pymongo>=4.17.0,<5.0.0",
    "atheris>=3.0.0,<4.0.0; python_version>='3.12' and sys_platform != 'win32'",
    "sphinx-argparse>=0.5.0",
    "playwright",
    "axe-playwright-python",
    "click>=8.3.3"
]
docs = [
    "furo<2026.0.0",
    "myst-parser>=1.0.0",
    "mypy>=1.15.0,<2.4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
exclude = ["sandbox", "vulture_whitelist.py"]
src = ["packages/core/src", "packages/plugins-workflows/src", "packages/providers-airflow/src", "packages/plugins-streamlit/src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["imednet", "imednet_workflows", "apache_airflow_providers_imednet", "imednet_streamlit"]

[tool.ruff.lint]
select = ["PL", "PIE", "FURB", "E", "F", "I", "N", "SLF", "D", "S", "B", "C4", "SIM", "UP", "PT", "RET", "RUF"]
ignore = ["FURB110", "PLC0105", "PLC0415", "PLE0704", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0108", "PLW0603", "PLW1510", "S106", "ANN", "S101", "E501", "E402", "E701", "E713", "F403", "F405", "N802", "F811"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["field_validator", "model_validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
warn_redundant_casts = false
ignore_missing_imports = true
plugins = []
exclude = '^(examples/.*|tests/.*|packages/.*/tests/.*|sandbox/.*)$'

[[tool.mypy.overrides]]
module = [
    "imednet.models.*",
    "imednet.errors.*"
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pythonjsonlogger.*",
    "opentelemetry",
    "opentelemetry.*",
    "airflow",
    "airflow.*",
    "typer",
    "typer.*",
    "rich",
    "rich.*",
    "faker",
    "faker.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "dotenv",
    "dotenv.*",
    "openpyxl",
    "openpyxl.*",
    "duckdb",
    "duckdb.*",
    "streamlit",
    "streamlit.*",
    "altair",
    "altair.*",
]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"docs/**/*.py" = ["D", "RUF"]
"packages/core/**/*.py" = ["SLF001"]
"packages/core/src/imednet/integrations/export.py" = ["D101", "D102", "D107", "S608"]
"packages/core/src/imednet/integrations/parquet.py" = ["S608"]
"packages/core/src/imednet/integrations/enrichment.py" = ["S307"]
"packages/core/src/imednet/utils/job_poller.py" = ["D107"]
"packages/plugins-workflows/src/imednet_workflows/duckdb_centralizer.py" = ["S608"]
"packages/plugins-workflows/src/imednet_workflows/extraction_engine.py" = ["S307"]
"tests/**/*.py" = ["SLF001", "S", "D", "PT", "SIM", "RUF", "B", "RET", "UP", "C", "F821"]
"scripts/**/*.py" = ["SLF001", "S", "D", "RUF", "RET"]
"examples/**/*.py" = ["SLF001", "S", "D", "RUF"]
"packages/plugins-sinks/tests/**/*.py" = ["SLF001", "S", "D", "PT", "SIM", "RUF", "B", "RET", "UP", "C", "F821"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
addopts = "-ra --ignore=tests/live --ignore=tests/browser"
testpaths = ["tests", "packages/plugins-sinks/tests"]

[tool.hatch.build.targets.wheel]
packages = []
include = ["CHANGELOG.md"]

[tool.hatch.envs.default]
features = ["dev", "docs"]
installer = "uv"
dependencies = [
    "imednet @ {root:uri}/packages/core",
    "imednet-workflows @ {root:uri}/packages/plugins-workflows",
    "apache-airflow-providers-imednet @ {root:uri}/packages/providers-airflow",
    "imednet-streamlit @ {root:uri}/packages/plugins-streamlit",
    "imednet-plugins-sinks @ {root:uri}/packages/plugins-sinks",
]

[tool.hatch.envs.default.scripts]
test = "pytest --ignore=tests/live/ --ignore=tests/browser/ {args:tests/}"
docs = "python scripts/build_docs.py"

[tool.hatch.envs.lint]
detached = true
python = "3.10"
dependencies = [
    "vulture>=2.11",
    "ruff>=0.11.6,<0.16.0",
    "mypy>=1.15.0,<2.4.0",
    "typos",
    "semgrep",
    "pip-audit",
    "detect-secrets",
    "pandas-stubs",
    "types-requests",
    "pydantic",
    "pylint",
    "click>=8.3.3",
    "pylint>=3.0.0",
    "vulture",
    "imednet @ {root:uri}/packages/core",
    "imednet-workflows @ {root:uri}/packages/plugins-workflows",
    "imednet-streamlit @ {root:uri}/packages/plugins-streamlit",
    "apache-airflow-providers-imednet @ {root:uri}/packages/providers-airflow",
    "imednet-plugins-sinks @ {root:uri}/packages/plugins-sinks",
]

[tool.hatch.envs.lint.scripts]
fmt = "ruff format --check {args:packages}"
ruff-check = "ruff check {args:packages}"
mypy-check = "mypy {args:packages}"
typos-check = "typos {args:packages}"
semgrep-check = "semgrep scan --config p/security-audit --error {args:packages}"
audit = "pip-audit -s osv --timeout 60 --ignore-vuln PYSEC-2026-3481 --ignore-vuln CVE-2026-52870 --ignore-vuln GHSA-hvrp-rf83-w775 --ignore-vuln PYSEC-2026-3482 --ignore-vuln GHSA-jpw9-pfvf-9f58 --ignore-vuln CVE-2026-52869 --ignore-vuln PYSEC-2026-3483 --ignore-vuln GHSA-vj7q-gjh5-988w --ignore-vuln CVE-2026-59950"
secrets = "detect-secrets-hook --baseline .secrets.baseline {args:packages}"
vulture-check = "vulture {args:packages} vulture_whitelist.py --min-confidence 80 --exclude **/tests/**,**/docs/**,**/scripts/**"
pylint-sim = "pylint --disable=all --enable=similarities --min-similarity-lines=20 --ignore-paths='.*/tests/.*,.*/docs/.*,.*/scripts/.*,.*/models/.*,tests/.*,docs/.*,scripts/.*,.*\\.json$' --ignore-patterns='.*monitor.*,.*integrations.*,.*sinks.*,.*testing.*' {args:packages}"
symilar-check = "pylint --disable=all --enable=duplicate-code --fail-under=9.0 {args:packages}"
all = [
    "fmt",
    "ruff-check",
    "mypy-check",
    "typos-check",
    "semgrep-check",
    "audit",
    "secrets",
    "vulture-check",
    "pylint-sim",
    "symilar-check"
]

[tool.hatch.envs.duplication]
detached = true
dependencies = ["pylint>=3.0.0"]

[tool.hatch.envs.duplication.scripts]
check = "pylint --disable=all --enable=duplicate-code {args:packages}"

[tool.hatch.envs.quality]
detached = true

[tool.hatch.envs.quality.scripts]
all = [
    "hatch run lint:all {args:packages}",
    "hatch run duplication:check {args:packages}"
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
imednet = { workspace = true }
imednet-workflows = { workspace = true }
imednet-streamlit = { workspace = true }
imednet-plugins-sinks = { workspace = true }
apache-airflow-providers-imednet = { workspace = true }




# Explicit exceptions for unmigrated legacy packages [cite:source_relaxed_packages]
[[tool.mypy.overrides]]
module = [
    "imednet.form_designer.*",
    "imednet.compat.*",
    "apache_airflow_providers_imednet.*"
]
strict = false
ignore_errors = true

[tool.pylint.SIMILARITIES]
min-similarity-lines = 15
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.MASTER]
ignore-paths = ["^tests/.*", "^.*/tests/.*", "^examples/.*", "^scripts/.*"]
